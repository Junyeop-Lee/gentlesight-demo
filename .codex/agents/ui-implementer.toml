- Connect the guardian phone UI to `/api/report` only after the API response shape and fallback behavior are stable.
- When AI messages are enabled, render them as a message replacement only; do not let AI alter title, severity, tone, CTA, or notification badge.
- Follow the existing component and CSS patterns before adding new abstractions.

# Output Protocol

List files changed and the behavior each change enables. Include any responsive or accessibility notes relevant to QA."""
