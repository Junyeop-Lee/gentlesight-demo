<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-label="Realistic isometric home interior with appliances">
  <defs>
    <linearGradient id="wall" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#ebe5d7"/>
      <stop offset="0.52" stop-color="#d5e4dd"/>
      <stop offset="1" stop-color="#c5dce7"/>
    </linearGradient>
    <linearGradient id="kitchenFloor" x1="0" x2="1">
      <stop offset="0" stop-color="#eebf7f"/>
      <stop offset="1" stop-color="#ffe4aa"/>
    </linearGradient>
    <linearGradient id="livingFloor" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#a9d7d2"/>
      <stop offset="1" stop-color="#9bc9d9"/>
    </linearGradient>
    <linearGradient id="utilityFloor" x1="0" x2="1">
